name: Update publications from Google Scholar

# Refreshes assets/publications.json on a schedule and commits any changes.
# The Publications page renders from that file (with a built-in fallback list).
#
# Reliability: set a repository secret named SERPAPI_KEY (free tier is plenty)
# for dependable results. Without it the job falls back to the `scholarly`
# package, which Google may rate-limit — in that case nothing is committed and
# the page keeps showing the last good list.
#
# Security: third-party actions are pinned to full commit SHAs (the tag is in
# the trailing comment). Only schedule / manual triggers are used, so no
# untrusted pull-request input reaches this job.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch: {}    # allow manual "Run workflow" from the Actions tab

# Least privilege by default; the single job below opts into what it needs.
permissions: {}

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push the refreshed publications.json
    env:
      SCHOLAR_ID: aR0shJYAAAAJ
      MAX_PUBS: "30"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # bibtexparser 2.x removed the module `scholarly` imports (ModuleNotFoundError:
        # bibtexparser.bibdatabase), so keep it on the 1.x line.
        run: pip install --disable-pip-version-check scholarly requests "bibtexparser<2"

      - name: Fetch publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_publications.py

      - name: Commit updated publications.json
        run: |
          if ! git diff --quiet -- assets/publications.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/publications.json
            git commit -m "chore: update publications from Google Scholar"
            git push
          else
            echo "No changes to publications.json."
          fi
